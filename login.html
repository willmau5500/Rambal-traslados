<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rambal – Iniciar Sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --purple:#6B21A8; --purple-mid:#7C3AED; --purple-light:#A855F7;
    --black:#0A0A0A; --gray-50:#F9FAFB; --gray-100:#F3F4F6;
    --gray-200:#E5E7EB; --gray-500:#6B7280; --gray-700:#374151;
    --red:#DC2626;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Outfit',sans-serif;min-height:100vh;background:#06040f;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

  .card{
    position:relative;z-index:10;
    background:rgba(255,255,255,0.97);
    border-radius:24px;padding:40px 42px 36px;
    width:100%;max-width:400px;margin:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08),0 32px 80px rgba(0,0,0,0.65);
    animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

  .logo-wrap{display:flex;align-items:center;gap:13px;margin-bottom:30px;}
  .logo-img{height:32px;object-fit:contain;}
  .logo-sep{width:1px;height:26px;background:var(--gray-200);}
  .logo-sub{font-size:11.5px;color:var(--gray-500);font-weight:400;line-height:1.35;}

  h2{font-size:25px;font-weight:800;color:var(--black);margin-bottom:5px;letter-spacing:-.5px;}
  .subtitle{font-size:13.5px;color:var(--gray-500);margin-bottom:26px;}

  .form-group{margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:5px;}
  input{
    width:100%;padding:11px 13px;
    border-radius:10px;border:1.5px solid var(--gray-200);
    font-family:'Outfit',sans-serif;font-size:14.5px;color:var(--black);
    background:var(--gray-50);outline:none;transition:.2s;
  }
  input:focus{border-color:var(--purple-mid);background:white;box-shadow:0 0 0 3px rgba(124,58,237,0.1);}

  .btn{
    width:100%;padding:12.5px;background:var(--black);color:white;
    border:none;border-radius:10px;
    font-family:'Outfit',sans-serif;font-size:14.5px;font-weight:700;
    cursor:pointer;margin-top:8px;transition:.2s;
    position:relative;overflow:hidden;
  }
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--purple),var(--purple-mid));opacity:0;transition:.25s;}
  .btn:hover::after{opacity:1;}
  .btn span{position:relative;z-index:1;}

  .error{
    padding:10px 13px;border-radius:8px;
    background:#FEF2F2;color:var(--red);border:1px solid #FECACA;
    font-size:13px;font-weight:600;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }

  .ruta-badge{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    z-index:5;display:flex;align-items:center;gap:9px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;padding:6px 16px;
    font-size:11.5px;color:rgba(255,255,255,0.45);
    font-family:'Outfit',sans-serif;white-space:nowrap;
    backdrop-filter:blur(6px);
  }
  .rdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

  @media(max-width:768px){
    body{ flex-direction:column; justify-content:flex-start; overflow-y:auto; }
    #bg-canvas{ position:relative; width:100%; height:220px; flex-shrink:0; }
    .card{
      position:relative; z-index:10;
      margin:0 12px 20px;
      border-radius:20px;
      padding:28px 24px 24px;
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }
    h2{font-size:22px;}
    .ruta-badge{ bottom:10px; font-size:11px; padding:5px 12px; }
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="ruta-badge">
  <span class="rdot" style="background:#A78BFA;"></span>
  Planta de Producción
  <span style="color:rgba(255,255,255,0.2);">→</span>
  <span class="rdot" style="background:#34D399;"></span>
  Bodega Producto Terminado
</div>

<div class="card">
  <div class="logo-wrap">
    <img src="logo-rambal-negro.png" alt="Rambal" class="logo-img"
      
      onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'">
    <div id="logo-text" style="display:none;font-size:20px;font-weight:900;color:#0A0A0A;letter-spacing:.5px;">Rambal</div>
    <div class="logo-sep"></div>
    <div class="logo-sub">Sistema de<br>Traslados</div>
  </div>

  <h2>Bienvenido</h2>
  <p class="subtitle">Ingresá tus credenciales para continuar</p>

  <div id="error-msg" class="error" style="display:none;">
    <span>⚠</span><span id="error-text"></span>
  </div>

  <div class="form-group">
    <label>Usuario</label>
    <input type="text" id="username" placeholder="tu.usuario" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" onclick="login()"><span id="btn-text">Ingresar</span></button>
</div>

<script>
// ── CANVAS MEJORADO ─────────────────────────────────────────
(function(){
  const cv = document.getElementById('bg-canvas');
  const ctx = cv.getContext('2d');

  function resize(){
    cv.width  = cv.offsetWidth  || window.innerWidth;
    cv.height = cv.offsetHeight || window.innerHeight;
  }
  resize();
  window.addEventListener('resize', ()=>{ resize(); });

  // Partículas flotantes
  const particles = Array.from({length:55}, () => ({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18,
    r: Math.random()*1.4+.4,
    o: Math.random()*.18+.04,
    color: Math.random()>.6 ? '139,92,246' : '99,102,241'
  }));

  // Cajas
  const boxes = Array.from({length:9}, (_,i) => ({
    t: i/9,
    speed: .0022+Math.random()*.0018,
    s: 12+Math.random()*10,
    arc: 28+Math.random()*20,
    side: (Math.random()>.5?1:-1) * (Math.random()*.35),
    phase: Math.random()*Math.PI*2,
  }));

  // Ease cubic in-out
  function ease(t){ return t<.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1; }

  function building(x, y, roofColor, glowColor, label) {
    const bw=42, bh=56;
    // sombra suave en el suelo
    const grd = ctx.createRadialGradient(x,y+6,0, x,y+6,30);
    grd.addColorStop(0, 'rgba(0,0,0,0.25)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(x,y+6,30,8,0,0,Math.PI*2); ctx.fill();

    // cuerpo del edificio
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = .9;
    ctx.beginPath(); ctx.roundRect(x-bw/2, y-bh, bw, bh, 4); ctx.fill(); ctx.stroke();

    // ventanas
    for(let r=0;r<3;r++) for(let c=0;c<2;c++){
      const lit = Math.sin(Date.now()*.0003 + r*1.3 + c*2.1 + x) > .2;
      ctx.fillStyle = lit ? 'rgba(255,248,180,0.22)' : 'rgba(255,255,255,0.05)';
      ctx.beginPath(); ctx.roundRect(x-bw/2+7+c*19, y-bh+8+r*17, 11,10,1); ctx.fill();
    }

    // techo triangular
    ctx.beginPath();
    ctx.moveTo(x-bw/2-6, y-bh);
    ctx.lineTo(x, y-bh-20);
    ctx.lineTo(x+bw/2+6, y-bh);
    ctx.closePath();
    ctx.fillStyle = roofColor; ctx.fill();

    // antena + luz
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(x,y-bh-20); ctx.lineTo(x,y-bh-30); ctx.stroke();
    ctx.shadowColor=glowColor; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(x, y-bh-31, 2.5, 0, Math.PI*2);
    ctx.fillStyle=glowColor; ctx.fill(); ctx.shadowBlur=0;

    // label
    ctx.fillStyle='rgba(255,255,255,0.38)';
    ctx.font='500 11px Outfit,sans-serif'; ctx.textAlign='center';
    ctx.fillText(label, x, y+18);
  }

  function drawBox(x, y, s, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    // sombra proyectada en el suelo
    ctx.fillStyle = 'rgba(109,40,217,0.18)';
    ctx.beginPath(); ctx.ellipse(x, y+s*.6+4, s*.55, 3, 0, 0, Math.PI*2); ctx.fill();
    // glow
    ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=18;
    ctx.fillStyle='rgba(109,40,217,0.42)';
    ctx.strokeStyle='#A78BFA'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(x-s/2, y-s/2, s, s, 3); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;
    // líneas internas
    ctx.strokeStyle='rgba(221,214,254,0.65)'; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(x-s/2+2,y); ctx.lineTo(x+s/2-2,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-s/2+2); ctx.lineTo(x,y+s/2-2); ctx.stroke();
    // esquinas
    const co=3;
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dy])=>{
      ctx.strokeStyle='rgba(196,181,253,0.9)'; ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(x+dx*s/2, y+dy*(s/2-co));
      ctx.lineTo(x+dx*s/2, y+dy*s/2);
      ctx.lineTo(x+dx*(s/2-co), y+dy*s/2);
      ctx.stroke();
    });
    ctx.restore();
  }

  let frame = 0;
  function draw() {
    const W=cv.width, H=cv.height;
    ctx.clearRect(0,0,W,H);

    // fondo degradado sutil
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#06040f');
    bg.addColorStop(.5,'#0d0820');
    bg.addColorStop(1,'#060410');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // grid
    ctx.strokeStyle='rgba(99,102,241,0.055)'; ctx.lineWidth=.5;
    const gs=55;
    for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // partículas
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.color},${p.o})`; ctx.fill();
    });

    const pX=W*.16, bX=W*.84, mY=H*.56;

    // ruta punteada
    ctx.save(); ctx.setLineDash([5,8]);
    ctx.strokeStyle='rgba(139,92,246,0.18)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pX+24,mY); ctx.lineTo(bX-24,mY); ctx.stroke();
    ctx.restore();

    // flecha dirección centro
    ctx.save();
    ctx.fillStyle='rgba(167,139,250,0.4)';
    ctx.beginPath();
    ctx.moveTo(W/2-9,mY-6); ctx.lineTo(W/2+3,mY); ctx.lineTo(W/2-9,mY+6);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // edificios
    building(pX, mY+10, 'rgba(109,40,217,0.65)', '#A78BFA', 'Planta');
    building(bX, mY+10, 'rgba(4,120,87,0.65)',   '#34D399', 'Bodega');

    // cajas
    boxes.forEach(b=>{
      b.t+=b.speed; if(b.t>1) b.t=0;
      const et=ease(b.t);
      const x=pX+24+(bX-48-pX)*et;
      const y=mY-Math.sin(b.t*Math.PI)*b.arc + b.side*H*.08 + Math.sin(frame*.025+b.phase)*2;
      const alpha=b.t<.07?b.t/.07:b.t>.93?(1-b.t)/.07:1;
      drawBox(x,y,b.s,alpha*.92);
    });

    // texto sutil
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.font='400 11px Outfit,sans-serif'; ctx.textAlign='center';
    ctx.fillText('traslados en tiempo real', W/2, mY+H*.15+20);

    frame++;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<script>
const SUPA_URL='https://glprwcufdhrdvxgwpage.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdscHJ3Y3VmZGhyZHZ4Z3dwYWdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4ODc3NjEsImV4cCI6MjA4OTQ2Mzc2MX0.Nhk7wMznJumjGaATD3qYDkH8MTGuylPQjdLcDZDNA_M';

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function supaFetch(path,opts={}){
  const res=await fetch(`${SUPA_URL}/rest/v1/${path}`,{...opts,headers:{
    'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,
    'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})
  }});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  return res.json().catch(()=>null);
}
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('btn-text');
  const errDiv=document.getElementById('error-msg');
  const errTxt=document.getElementById('error-text');
  if(!username||!password){errDiv.style.display='flex';errTxt.textContent='Completá todos los campos.';return;}
  btn.textContent='Verificando...'; errDiv.style.display='none';
  try{
    const hash=await sha256(password);
    const data=await supaFetch(`usuarios?username=eq.${encodeURIComponent(username)}&activo=eq.true&select=*`);
    if(!data||!data.length||data[0].password!==hash){
      errDiv.style.display='flex';errTxt.textContent='Usuario o contraseña incorrectos.';
      btn.textContent='Ingresar';return;
    }
    const user=data[0];
    sessionStorage.setItem('rambal_user',JSON.stringify({id:user.id,nombre:user.nombre,username:user.username,rol:user.rol}));
    window.location.href='dashboard.html';
  }catch(e){
    errDiv.style.display='flex';errTxt.textContent='Error de conexión. Intentá de nuevo.';
    btn.textContent='Ingresar';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
if(sessionStorage.getItem('rambal_user'))window.location.href='dashboard.html';
</script>
</body>
</html>
